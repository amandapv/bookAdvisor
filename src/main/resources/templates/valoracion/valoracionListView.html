<!DOCTYPE html>
<html lang="en">

<head th:replace="~{/fragmentos.html::cabecera}"></head>

<body>
    
    <nav th:replace="~{/fragmentos.html::menu}"></nav>

    <div class="container mt-5"></div>

    <h1>Lista Valoraciones</h1>

    <h3 class="mb-4">Libro: <span th:text="${libro.titulo}"></span></h3>

    <table class="table table-striped border shadow-sm">
        <thead>
            <tr>
                <th>ID</th> <th>Usuaria/o</th>
                <th>Puntuación</th> <th>Comentarios</th> <th>Borrar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="valoracion :${listaValoraciones}">
                <td th:text="${valoracion.id}">ID</td>
                <td th:text="${valoracion.usuario.nombre}">usuarix</td>
                <td th:text="${valoracion.puntuacion}">puntuación</td>
                <td th:text="${valoracion.comentario}">comentarios</td>
                <td> <a th:href="@{/public/valoraciones/borrar/{id} (id=${valoracion.id})}" class="btn btn-warning">Borrar</a> </td>
            </tr>
        </tbody>
    </table>
    
    <a th:href="@{/public/valoraciones/nuevo/{idLibro} (idLibro=${libro.id})}" >Nueva valoración</a>

    <br><br>

    <div th:if="${msg!=null}">
        <p class="alert alert-primary" role="alert" th:text="${msg}">errores</p>
    </div>
    

</body>
