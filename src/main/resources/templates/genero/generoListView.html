<!DOCTYPE html>
<html lang="en">
<head th:replace="~{/fragmentos.html::cabecera}"></head>
<body>
    
    <nav th:replace="~{/fragmentos.html::menu}"></nav>

    <h1>Géneros</h1>

    <table class="table table-striped border shadow-sm">
        <thead>
            <tr>
                <th>ID</th> <th>Nombre</th>
                <th>Editar</th> <th>Borrar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="genero : ${listaGeneros}">
                <td th:text="${genero.id}">ID</td>
                <td th:text="${genero.nombre}">nombre</td>
                <td> <a th:href="@{/public/generos/editar/{id} (id=${genero.id})}" class="btn btn-warning">Editar</a> </td>
                <td> <a th:href="@{/public/generos/borrar/{id} (id=${genero.id})}" class="btn btn-danger">Borrar</a> </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${msg!=null}">
        <p class="alert alert-primary" role="alert" th:text="${msg}">errores</p>
    </div>
</body>
