<!DOCTYPE html>
<html lang="en">
<head th:replace="~{/fragmentos.html::cabecera}"></head>
<body>
    
    <nav th:replace="~{/fragmentos.html::menu}"></nav>

    <h2>Editar género</h2>

    <form action="#" method="post" th:action="@{/public/generos/editar/{id}/submit(id=${generoForm.id})}" th:object="${generoForm}">

        <input type="hidden" id="id" th:field="*{id}">

        <label>Nombre del género:
            <input type="text" id="nombre" th:field="*{nombre}">
            <span th:classappend="${#fields.hasErrors('nombre')} ? 'cssError'" th:errors="*{nombre}"></span>
        </label> <br><br>

        <input type="submit" value="Enviar"> <br><br>

        <a th:href="@{/public/generos/}">Volver</a>

    </form>

</body>
